<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Torchsnap — keyboard-first launcher</title>

<!-- Mascot images are referenced via JSX template strings; lift them
     so the bundler can capture them. -->
<meta name="ext-resource-dependency" content="assets/mascots/snappy-original-384.webp"             data-resource-id="mascot-original"/>
<meta name="ext-resource-dependency" content="assets/mascots/snappy-cloak-and-torch-384.webp"      data-resource-id="mascot-cloak-and-torch"/>
<meta name="ext-resource-dependency" content="assets/mascots/snappy-astronaut-384.webp"            data-resource-id="mascot-astronaut"/>
<meta name="ext-resource-dependency" content="assets/mascots/snappy-dashing-captain-384.webp"      data-resource-id="mascot-dashing-captain"/>
<meta name="ext-resource-dependency" content="assets/mascots/snappy-dino-kigurumi-384.webp"        data-resource-id="mascot-dino-kigurumi"/>
<meta name="ext-resource-dependency" content="assets/mascots/snappy-deep-sea-diver-384.webp"       data-resource-id="mascot-deep-sea-diver"/>
<meta name="ext-resource-dependency" content="assets/mascots/snappy-banana-goggle-minion-384.webp" data-resource-id="mascot-banana-goggle-minion"/>

<link rel="stylesheet" href="colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    color: var(--color-text-primary);
    background: var(--color-surface);
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "cv11", "ss01", "ss03";
  }

  /* Caret used in the live-typing demo */
  .ts-caret {
    display: inline-block;
    width: 2px;
    height: 18px;
    background: var(--color-accent);
    margin-left: 1px;
    vertical-align: -3px;
    animation: ts-blink 1.05s steps(1) infinite;
  }
  @keyframes ts-blink {
    0%, 50% { opacity: 1; }
    50.01%, 100% { opacity: 0; }
  }

  /* Cosplay image swap — gentle fade-in on key change */
  .ts-cosplay-img {
    animation: ts-pop .55s ease-out;
  }
  @keyframes ts-pop {
    0% { opacity: 0; transform: scale(0.94); }
    100% { opacity: 1; transform: scale(1); }
  }

  a { text-decoration: none; }

  /* The V1b artboard is laid out on a 1280-wide canvas. We render it
     centered, full-width up to that point. */
  #root { display: block; }
  .ts-page-wrap { width: 1280px; max-width: 100%; margin: 0 auto; }
</style>
</head>
<body data-theme="dark">

<!-- Bundler splash + no-JS fallback -->
<template id="__bundler_thumbnail" data-bg-color="#0a5e3e">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="g" cx="50%" cy="50%" r="50%">
        <stop offset="0%"  stop-color="#ffd166" stop-opacity="0.55"/>
        <stop offset="60%" stop-color="#ffd166" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle cx="600" cy="400" r="320" fill="url(#g)"/>
    <g transform="translate(600 400)">
      <path d="M0 -180 C 70 -110 90 -40 60 30 C 100 0 120 -30 110 -90 C 160 -20 150 80 60 130 C -40 170 -130 100 -110 0 C -90 -70 -50 -120 0 -180 Z"
            fill="#ffd166"/>
      <path d="M0 -110 C 40 -60 50 -20 30 20 C 70 -10 70 -60 50 -100 C 90 -50 80 30 20 70 C -30 90 -70 60 -60 10 C -55 -30 -30 -70 0 -110 Z"
            fill="#ff8a3d"/>
    </g>
    <text x="600" y="660" text-anchor="middle"
          font-family="Inter, system-ui, sans-serif"
          font-size="56" font-weight="600" fill="#f4ead2"
          letter-spacing="-1">Torchsnap</text>
  </svg>
</template>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="src/Shared.standalone.jsx"></script>
<script type="text/babel" src="src/V1bClassicHeroSnappy.standalone.jsx"></script>

<script type="text/babel">
  const App = () => (
    <div className="ts-page-wrap">
      <V1bClassicHeroSnappy/>
    </div>
  );
  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

</body>
</html>
